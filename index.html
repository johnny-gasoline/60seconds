        }

        .artist { font-weight: bold; font-size: 1.1rem; color: white; }
        .title { color: #ccc; }
        .meta {

        .vol-badge {

        const allSongs = [];
        const volumesList = [];

        // Parse the raw data
        function parseData() {
            const lines = rawData.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let currentVol = '';

            lines.forEach(line => {
                if (line.toLowerCase().startsWith('volume')) {
                    currentVol = line.replace(':', '').trim();
                    if (!volumesList.includes(currentVol)) {
                        volumesList.push(currentVol);
                    }
                } else if (line.includes('-')) {
                    // Expecting: Artist - Title - Length
                    const parts = line.split(' - ');
                    if (parts.length >= 3) {
                        const length = parts.pop();
                        const artist = parts[0];
                        const title = parts.slice(1).join(' - '); // Re-join if title had a dash
                        allSongs.push({
                            volume: currentVol,
                            artist: artist,
                            title: title,
                            length: length,
                            searchStr: (artist + " " + title).toLowerCase()
                        });
                    }
                }
            });
        }

        // Levenshtein Distance for Generous Fuzzy Search
        function levenshtein(a, b) {
            if(a.length === 0) return b.length;
            if(b.length === 0) return a.length;
            const matrix = [];
            for(let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for(let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for(let i = 1; i <= b.length; i++) {
                for(let j = 1; j <= a.length; j++) {
                    if(b.charAt(i-1) == a.charAt(j-1)) {
                        matrix[i][j] = matrix[i-1][j-1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i-1][j-1] + 1, Math.min(matrix[i][j-1] + 1, matrix[i-1][j] + 1));
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function isFuzzyMatch(query, text) {
            if (!query) return true;
            
            // Clean strings
            query = query.toLowerCase().replace(/[^a-z0-9]/g, '');
            text = text.toLowerCase().replace(/[^a-z0-9]/g, '');
            
            // Direct substring match (catches exact partial words)
            if (text.includes(query)) return true;

            // Loose generous match: Does text contain all characters of query in order?
            let qIdx = 0;
            for(let i=0; i < text.length && qIdx < query.length; i++){
                if(text[i] === query[qIdx]) qIdx++;
            }
            if (qIdx === query.length) return true;

            // Check words individually with Levenshtein for terrible spelling
            // If the query is close enough to any word in the text (distance <= 2 for words > 4 chars)
            const textWords = text.split(/\s+/);
            for (let word of textWords) {
                if (word.length > 3 && levenshtein(query, word) <= 2) return true;
                if (word.length <= 3 && levenshtein(query, word) <= 1) return true;
            }

            return false;
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            volumesList.forEach(vol => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn';
                btn.dataset.target = vol;
                btn.innerText = vol;
                btn.addEventListener('click', () => switchTab(vol, btn));
                tabsContainer.appendChild(btn);
            });
            
            document.querySelector('.tab-btn[data-target="all"]').addEventListener('click', (e) => switchTab('all', e.target));
        }

        function switchTab(targetVol, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            const linkContainer = document.getElementById('volumeLinkContainer');
            const linkTag = document.getElementById('spotifyLink');
            
            if (targetVol !== 'all' && spotifyLinks[targetVol]) {
                linkContainer.classList.remove('hidden');
                linkTag.href = spotifyLinks[targetVol];
                linkTag.innerHTML = `🎵 Listen to ${targetVol} on Spotify`;
            } else {
                linkContainer.classList.add('hidden');
            }

            document.getElementById('searchInput').value = '';
            
            let filtered;
            if (targetVol === 'all') {
                filtered = allSongs;
            } else {
                filtered = allSongs.filter(s => s.volume === targetVol);
            }
            renderSongs(filtered);
        }

        function renderSongs(songsToRender) {
            const list = document.getElementById('songList');
            list.innerHTML = '';
            
            if (songsToRender.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding: 20px;">No matching songs found.</div>';
                return;
            }

            songsToRender.forEach(song => {
                const li = document.createElement('li');
                li.className = 'song-item';
                
                li.innerHTML = `
                    <div class="song-info">
                        <span class="artist">${song.artist}</span>
                        <span class="title">${song.title}</span>
                    </div>
                    <div class="meta">
                        <span class="vol-badge">${song.volume}</span>
                        <span class="length">${song.length}</span>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function handleSearch(e) {
            const query = e.target.value;
            
            // Switch to ALL tab visually without triggering full switchTab logic
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.tab-btn[data-target="all"]').classList.add('active');
            document.getElementById('volumeLinkContainer').classList.add('hidden');

            const filtered = allSongs.filter(s => isFuzzyMatch(query, s.searchStr));
            renderSongs(filtered);
        }

        // Initialize
        parseData();
        renderTabs();
        renderSongs(allSongs);

        document.getElementById('searchInput').addEventListener('input', handleSearch);

    </script>
